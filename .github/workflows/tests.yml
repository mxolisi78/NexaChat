name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexachat_test
          POSTGRES_USER: nexachat
          POSTGRES_PASSWORD: nexachat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexachat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      DATABASE_URL: "postgresql://nexachat:nexachat_test@localhost:5432/nexachat_test"
      REDIS_URL: "redis://localhost:6379/0"
      GNEWS_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test chat --verbosity=2